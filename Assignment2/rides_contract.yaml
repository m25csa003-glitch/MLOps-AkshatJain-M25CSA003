# =====================================================
# DATA CONTRACT: CityMove Ride Share
#
# Producer: Data Engineering Team
# Consumer: Machine Learning Team
#
# Agreed Terms:
# - Schema changes must not break ML models
# - Fare must never be negative
# - Driver rating must be between 1.0 and 5.0
# - Passenger ID is PII
# - Freshness: 30 minutes
#
# Enforcement: Hard circuit breaker on invalid data
# =====================================================

dataContractSpecification: 0.9.3
id: urn:datacontract:citymove:rides
version: 1.0.0

info:
  title: "CityMove Ride Data"
  description: |
    Ride transaction data for pricing model training.
    Used by ML team for dynamic pricing.
  owner: "Data Engineering Team"
  contact:
    name: "Data Lead"
    email: "data@citymove.com"
    slack: "#data-support"
  classification: confidential
  tags: [rides, pricing, ml, pii]

schema:
  type: object
  properties:

    ride_id:
      type: string
      description: "Unique ride identifier"
      pii: false
      # physical_mapping: r_id

    pickup_timestamp:
      type: string
      format: date-time
      description: "Pickup time in UTC"
      pii: false
      # physical_mapping: ts_start

    passenger_id:
      type: integer
      description: "Unique passenger identifier"
      pii: true
      # physical_mapping: pax_id

    driver_rating:
      type: number
      minimum: 1.0
      maximum: 5.0
      description: "Driver rating (1 to 5)"
      pii: false
      # physical_mapping: d_rating

    fare_usd:
      type: number
      minimum: 0
      description: "Total fare in USD"
      pii: false
      # physical_mapping: fare_final

    distance_meters:
      type: number
      description: "Distance travelled in meters"
      pii: false
      # physical_mapping: dist_m

  required:
    - ride_id
    - pickup_timestamp
    - passenger_id
    - driver_rating
    - fare_usd
    - distance_meters

sla:
  freshness:
    threshold: "30 minutes"
    description: "Data available within 30 minutes"
  availability:
    percentage: "99.9%"
    description: "High availability"
  retention:
    period: "2 years"
    description: "Historical retention"

quality:

  - name: fare_non_negative
    type: validity
    expression: "fare_usd >= 0"
    threshold: "100%"
    enforcement: hard
    description: "Fare must not be negative"

  - name: rating_valid_range
    type: validity
    expression: "driver_rating >= 1.0 AND driver_rating <= 5.0"
    threshold: "100%"
    enforcement: hard
    description: "Rating must be between 1 and 5"

  - name: distance_not_null
    type: completeness
    column: distance_meters
    threshold: "100%"
    enforcement: hard
    description: "Distance cannot be null"
